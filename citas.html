<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Cita - Dental Araiza</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Dental Araiza</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="servicio.html">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="citas.html">Agendar Cita</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Formulario de citas -->
  <div class="container my-5">
    <h2 class="text-center mb-4">Agendar tu Cita</h2>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow p-4">
          <form>
            <!-- Nombre -->
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre" required>
            </div>
            <!-- Teléfono -->
            <div class="mb-3">
              <label for="telefono" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="telefono" placeholder="Ej. 444-123-4567" required>
            </div>
            <!-- Correo -->
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required>
            </div>
            <!-- Servicio -->
            <div class="mb-3">
              <label for="servicio" class="form-label">Servicio</label>
              <select class="form-select" id="servicio" required>
                <option value="">Selecciona un servicio</option>
                <option>Consulta de valoración</option>
                <option>Brackets</option>
                <option>Prótesis dental</option>
                <option>Limpieza dental</option>
                <option>Blanqueamiento dental</option>
                <option>Empaste</option>
                <option>Extracciones</option>
                <option>Incrustaciones</option>
                <option>Desmanchamiento</option>
                <option>Curetaje (Limpieza Profunda)</option>
                <option>Guardas Occlusales</option>
                <option>Mantenedores de espacios</option>
              </select>
            </div>
            <!-- Fecha -->
            <div class="mb-3">
              <label for="fecha" class="form-label">Fecha</label>
              <input type="date" class="form-control" id="fecha" required>
            </div>
            <!-- Hora -->
            <div class="mb-3">
              <label for="hora" class="form-label">Hora</label>
              <input type="time" class="form-control" id="hora" required>
            </div>
            <!-- Comentarios -->
            <div class="mb-3">
              <label for="comentarios" class="form-label">Comentarios adicionales</label>
              <textarea class="form-control" id="comentarios" rows="3" placeholder="Escribe detalles si lo deseas"></textarea>
            </div>
            <!-- Botón -->
            <div class="text-center">
              <button type="submit" class="btn btn-primary">Reservar Cita</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-light text-center py-4">
    <p>© 2025 Dental Araiza</p>
  </footer>
</body>
</html>
